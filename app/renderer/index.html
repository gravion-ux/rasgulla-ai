<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: orb-vendor:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: orb-vendor: data: blob:; media-src blob: file: data:; font-src 'self' file:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rasgulla</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="shell-header">
    <div class="brand" id="brand">Rasgulla</div>
    <div class="controls">
      <button id="btnClose" title="Close" aria-label="Close">&times;</button>
    </div>
  </header>

  <div class="pill" role="tablist" aria-label="Orb state">
    <button role="tab" data-state="listening" aria-pressed="true">Listening</button>
    <button role="tab" data-state="thinking" aria-pressed="false">Thinking</button>
    <button role="tab" data-state="speaking" aria-pressed="false">Speaking</button>
  </div>

  <speaking-orb id="orb" state="listening" level="0" particles="12000" rest="listening" title="Click the orb to talk"></speaking-orb>
</div>

<audio id="voice" src=""></audio>

<script src="orb-vendor://speaking-orb.js"></script>
<script type="module" src="renderer.js"></script>
</body>
</html>
